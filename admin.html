<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complimentary Access | Strategic Fretboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#081727" />
  <link rel="icon" type="image/png" href="assets/images/strategic-fretboard-logo.png" />
  <link rel="stylesheet" href="assets/css/fretboard.css?v=20261024-5" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/images/strategic-fretboard-logo.png" alt="" width="1774" height="887" /><span>Strategic Fretboard</span></a>
    <a class="header-download" href="index.html">Back to website</a>
  </header>

  <main class="admin-page" id="main-content">
    <section class="admin-card" aria-labelledby="admin-title">
      <h1 id="admin-title">Admin</h1>

      <div id="admin-signed-out">
        <button class="apple-sign-in" id="apple-sign-in" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 12.9c0-2.7 2.2-4 2.3-4.1-1.3-1.9-3.3-2.1-4-2.1-1.7-.2-3.3 1-4.2 1-.9 0-2.2-1-3.6-.9-1.9 0-3.6 1.1-4.6 2.8-2 3.4-.5 8.5 1.4 11.2.9 1.4 2.1 2.9 3.6 2.8 1.4-.1 2-.9 3.7-.9 1.7 0 2.2.9 3.7.9 1.5 0 2.5-1.4 3.5-2.8 1.1-1.6 1.5-3.2 1.6-3.3-.1 0-3.4-1.3-3.4-4.6ZM13.9 4.9c.8-1 1.4-2.4 1.2-3.8-1.2.1-2.7.8-3.6 1.8-.8.9-1.5 2.3-1.3 3.7 1.4.1 2.8-.7 3.7-1.7Z"/></svg>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div id="admin-panel" hidden>
        <div class="admin-session">
          <div><small>Signed in as</small><strong id="admin-email"></strong></div>
          <button id="admin-sign-out" type="button">Sign out</button>
        </div>
        <form class="complimentary-form" id="complimentary-form">
          <label for="complimentary-email">Email receiving access</label>
          <div class="complimentary-row">
            <input id="complimentary-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="person@example.com" required />
            <button type="submit">Add access</button>
          </div>
        </form>
      </div>

      <div class="admin-status" id="admin-status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://gopyzkcmvkbusdnwjlbb.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CYM_aXzslre6SE8P-tTYBw_sw_-gQ1h";
    const ADMIN_FUNCTION = `${SUPABASE_URL}/functions/v1/strategic-fretboard-admin`;
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const signedOut = document.getElementById("admin-signed-out");
    const panel = document.getElementById("admin-panel");
    const administratorEmail = document.getElementById("admin-email");
    const status = document.getElementById("admin-status");
    const form = document.getElementById("complimentary-form");

    function setStatus(message, kind = "") {
      status.textContent = message;
      status.dataset.kind = kind;
    }

    function isAppleAdministratorSession(session) {
      const provider = session?.user?.app_metadata?.provider;
      const providers = session?.user?.app_metadata?.providers || [];
      return provider === "apple" || providers.includes("apple");
    }

    async function callAdmin(session, body) {
      const response = await fetch(ADMIN_FUNCTION, {
        method: "POST",
        headers: {
          apikey: SUPABASE_PUBLISHABLE_KEY,
          Authorization: `Bearer ${session.access_token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(body),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok !== true) throw new Error(result.error || "Administrator access is unavailable.");
      return result;
    }

    async function showAdministrator(session) {
      setStatus("Confirming administrator access…");
      try {
        const result = await callAdmin(session, { action: "status" });
        administratorEmail.textContent = result.administratorEmail;
        signedOut.hidden = true;
        panel.hidden = false;
        setStatus("Administrator access confirmed.", "success");
      } catch (error) {
        await client.auth.signOut();
        signedOut.hidden = false;
        panel.hidden = true;
        setStatus(error.message, "error");
      }
    }

    document.getElementById("apple-sign-in").addEventListener("click", () => {
      setStatus("Opening Apple sign in…");
      const redirectTo = encodeURIComponent(`${window.location.origin}/admin.html`);
      window.location.assign(`${SUPABASE_URL}/auth/v1/authorize?provider=apple&redirect_to=${redirectTo}`);
    });

    document.getElementById("admin-sign-out").addEventListener("click", async () => {
      await client.auth.signOut();
      panel.hidden = true;
      signedOut.hidden = false;
      setStatus("Signed out.");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      const email = new FormData(form).get("email").trim().toLowerCase();
      button.disabled = true;
      button.textContent = "Adding…";
      setStatus("Saving complimentary access…");
      try {
        const { data } = await client.auth.getSession();
        if (!data.session) throw new Error("Sign in with Apple to continue.");
        const result = await callAdmin(data.session, { action: "addComplimentary", email });
        form.reset();
        setStatus(`${result.email} now has complimentary access.`, "success");
      } catch (error) {
        setStatus(error.message || "Complimentary access could not be added.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Add access";
      }
    });

    client.auth.getSession().then(async ({ data }) => {
      if (data.session && isAppleAdministratorSession(data.session)) {
        showAdministrator(data.session);
      } else if (data.session) {
        await client.auth.signOut();
        setStatus("");
      }
    });
  </script>
</body>
</html>
